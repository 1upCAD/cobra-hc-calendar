name: Update calendar

on:
  schedule:
    # Every 4 hours (UTC)
    - cron: '17 */4 * * *'
  workflow_dispatch:
  push:
    paths:
      - config.json
      - Update-TeamCalendar.ps1

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build calendar
        shell: pwsh
        run: ./Update-TeamCalendar.ps1 -ShowGames

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || (git commit -m "Schedule update" && git push)
