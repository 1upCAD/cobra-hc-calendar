name: Update calendar

on:
  schedule:
    # Every 4 hours (UTC)
    - cron: '17 */4 * * *'
  workflow_dispatch:
  push:
    paths:
      - config.json
      - Update-TeamCalendar.ps1
      - .github/workflows/update-calendar.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Save copy of the page
        shell: pwsh
        run: |
          $url = (Get-Content -Raw config.json | ConvertFrom-Json).ScheduleUrl
          New-Item -ItemType Directory -Force debug | Out-Null
          Invoke-WebRequest -Uri $url -UserAgent 'Mozilla/5.0 (team calendar sync)' -OutFile debug/page.html
          Get-Item debug/page.html | Select-Object Length

      - name: Build calendar
        id: build
        continue-on-error: true
        shell: pwsh
        run: ./Update-TeamCalendar.ps1 -HtmlFile debug/page.html -ShowGames

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs debug
          git diff --cached --quiet || (git commit -m "Schedule update" && git push)

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
